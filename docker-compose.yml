services:
  postgres:
    image: postgres:16-alpine
    container_name: zarketplaces-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zarketplace
      POSTGRES_PASSWORD: zarketplace
      POSTGRES_DB: zarketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarketplace"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: zarketplaces-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=zarketplace
      - DB_PASSWORD=zarketplace
      - DB_DATABASE=zarketplace
      - DB_SYNC=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://192.168.50.11:3000/auth/google/callback}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-zigbang.com}
      - SESSION_SECRET=${SESSION_SECRET:-local-dev-secret}
      - APP_URL=${APP_URL:-http://192.168.50.11:3000}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

volumes:
  pgdata:
