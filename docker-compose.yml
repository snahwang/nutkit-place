services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: zarketplaces-dynamodb
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -qE '(200|400)'"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: zarketplaces-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_REGION=ap-northeast-2
      - DYNAMODB_TABLE_NAME=ZarketPlaces
      # Dummy AWS creds for DynamoDB Local (requires signed requests)
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=ap-northeast-2
      - AWS_EC2_METADATA_DISABLED=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://192.168.50.11:3000/auth/google/callback}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-zigbang.com}
      - SESSION_SECRET=${SESSION_SECRET:-local-dev-secret}
      - APP_URL=${APP_URL:-http://192.168.50.11:3000}
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      dynamodb-local:
        condition: service_healthy
    command: npm run start:dev

volumes:
  dynamodb-data:
